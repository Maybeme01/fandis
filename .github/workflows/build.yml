name: FanCord Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Standalone
        run: pnpm buildWebStandalone

      - name: Build Desktop & Equibop Standalone
        run: pnpm buildStandalone

      - name: Get Short Commit Hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
          TAG_NAME="v-${SHORT_SHA}"
          RELEASE_TITLE="FanCord ${SHORT_SHA}"

          echo "Publishing release: $RELEASE_TITLE with tag: $TAG_NAME"

          # حذف أي release أو tag قديم يحمل نفس الاسم إن وجد
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" || true
          git push origin :refs/tags/"$TAG_NAME" || true

          # إنشاء Release رسمي جديد وإرفاق ملفات .asar
          gh release create "$TAG_NAME" \
            dist/desktop.asar \
            dist/equibop.asar \
            --title "$RELEASE_TITLE" \
            --notes "Automated FanCord build for commit ${SHORT_SHA}" \
            --latest
